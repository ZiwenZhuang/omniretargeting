# Nokov Motion Capture BVH Data Source Configuration Template
#
# Nokov is an optical motion capture system that exports marker-based
# skeleton data in standard BVH format. Bones use a 6-channel root joint
# (Xposition Yposition Zposition + Zrotation Xrotation Yrotation) and
# 3-channel child joints (Zrotation Xrotation Yrotation).
#
# Usage:
#   python -m omniretargeting.main \
#     --robot-config robot_models/unitree_h1/unitree_h1.json \
#     --source-config config_templates/nokov_template.yaml \
#     --output /tmp/retargeted.npz \
#     --save-video /tmp/retargeted.mp4

# Required: Data source type
type: nokov

# Required: Path to Nokov BVH motion file
motion: /path/to/nokov_capture.bvh

# Optional: Start frame index (default: 0)
# Allows skipping a warm-up period at the beginning of the capture
# start_frame: 0

# Optional: Path to terrain mesh file
# If not specified, a flat ground plane will be used
# terrain: /path/to/terrain.obj

# Optional: Framerate override (default: auto-detected from BVH "Frame Time")
# framerate: 120.0

# Notes:
# - BVH files from Nokov use Y-up coordinate system (converted to Z-up automatically)
# - Bone names are extracted from the BVH hierarchy and used as target_names
#   matching the "nokov" source entry in the robot config's target_mapping
# - Human height is estimated from head and foot positions in the first frame
# - Position units are automatically converted from cm to meters
# - Root orientation is estimated from joint positions by the retargeting pipeline
