# Bones-Seed (SOMA uniform) BVH Data Source Configuration Template
#
# Usage:
#   python -m omniretargeting.main \
#     --robot-config robot_models/unitree_g1/unitree_g1.json \
#     --source-config config_templates/bones_seed_template.yaml \
#     --output output.npz \
#     --save-video output.mp4

# Required: Data source type
type: bones_seed

# Required: Path to Bones-Seed BVH motion file
motion: /path/to/bones_seed/motion.bvh

# Optional: Path to terrain mesh file
# terrain: /path/to/terrain.obj

# Optional: Framerate override (default: auto-detected from BVH, typically 120 fps)
# framerate: 30.0
